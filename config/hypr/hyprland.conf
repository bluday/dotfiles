source = $XDG_CONFIG_HOME/hypr/hyprland/animations.conf
source = $XDG_CONFIG_HOME/hypr/hyprland/devices.conf
source = $XDG_CONFIG_HOME/hypr/hyprland/environmentVariables.conf
source = $XDG_CONFIG_HOME/hypr/hyprland/gestures.conf
source = $XDG_CONFIG_HOME/hypr/hyprland/keyBindings.conf
source = $XDG_CONFIG_HOME/hypr/hyprland/windowRules.conf

exec-once = blu-configure-gsettings
exec-once = hypridle
exec-once = hyprpaper
exec-once = ironbar

autogenerated = 0

cursor {
    default_monitor = $DEFAULT_MONITOR

    no_hardware_cursors = 1
}

decoration {
    rounding       = 2
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        
        passes = 2
        
        size = 20
        
        vibrancy = 0
    }

    shadow {
        color = rgba(00000050)
        
        enabled = true

        range = 5
        
        render_power = 5
    }
}

dwindle {
    preserve_split = true

    pseudotile = true
}

ecosystem {
    no_donation_nag = true
    no_update_news  = true
}

general {
    allow_tearing = false

    border_size = 1

    col.active_border   = rgba(323232bb)
    col.inactive_border = rgba(1e1e1ebb)

    gaps_in  = 4
    gaps_out = 16

    layout = dwindle

    resize_on_border = false
}

input {
    follow_mouse = 1

    kb_layout = se

    sensitivity = 0.8

    touchpad {
        natural_scroll = false
    }
}

master {
    new_status = master
}

monitorv2 {
    output = $DEFAULT_MONITOR
    
    mode = $MONITOR_TARGET_MODE
    
    position = 0x0

    scale = $MONITOR_TARGET_DPI_SCALE_FACTOR
}

misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true

    force_default_wallpaper = 0
}

xwayland {
    force_zero_scaling = true
}
