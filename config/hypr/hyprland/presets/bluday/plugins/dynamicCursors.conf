plugin:dynamic-cursors {
    enabled = true

    mode = tilt

    hyprcursor {
        enabled = true

        fallback = clientside

        nearest = true

        resolution = -1
    }

    rotate {
        length = 20

        offset = 0.0
    }

    shake {
        base = 4.0

        effects = false

        enabled = true

        influence = 0.0

        ipc = false

        limit = 0.0

        nearest = false

        speed = 4.0

        threshold = 6.0

        timeout = 1000
    }

    stretch {
        function = quadratic

        limit = 3000

        window = 100
    }

    tilt {
        function = negative_quadratic

        limit = 5000

        window = 100
    }
}
