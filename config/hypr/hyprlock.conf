$font = Sans

animations {
    enabled = true

    bezier = linear, 1, 1, 0, 0

    animation = fadeIn,         1, 1, linear
    animation = fadeOut,        1, 1, linear
    animation = inputFieldDots, 1, 1, linear
}

background {
    blur_passes = 2

    color = rgba(000000ff)

    path = $PRIMARY_WALLPAPER
}

general {
    hide_cursor = false
}

input-field {
    size = 400, 72
    
    outline_thickness = 2
    
    check_color = rgba(484848bb)
    fail_color  = rgba(484848bb)
    font_color  = rgba(888888ff)
    inner_color = rgba(1e1e1ebb)
    outer_color = rgba(323232bb)
    
    fade_on_empty = false
    
    rounding = 4

    font_family = $font
    
    fail_text        = Incorrect password
    placeholder_text = Enter password

    dots_size    = 0.2
    dots_spacing = 0.4

    position = 0, 0

    halign = center
    valign = center
}

label {
    text = $TIME

    font_size   = 108
    font_family = $font

    position = 0, 400
    
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    
    font_size   = 24
    font_family = $font

    position = 0, 280
    
    halign = center
    valign = center
}
