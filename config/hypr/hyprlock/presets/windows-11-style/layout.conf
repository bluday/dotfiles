$font = Sans

input-field {
    size = 400, 72
    
    outline_thickness = 2
    
    check_color = $checkColor
    fail_color  = $failColor
    font_color  = $fontColor
    inner_color = $innerColor
    outer_color = $outerColor
    
    fade_on_empty = false
    
    rounding = 4

    font_family = $font
    
    fail_text        = Incorrect password
    placeholder_text = Enter password

    dots_size    = 0.2
    dots_spacing = 0.4

    position = 0, 0

    halign = center
    valign = center
}

label {
    text = $TIME

    font_size   = 108
    font_family = $font

    position = 0, 400
    
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y"
    
    font_size   = 24
    font_family = $font

    position = 0, 280
    
    halign = center
    valign = center
}
